<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIVE · 작업 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>
:root{--ui-bg:#292326;--ui-fg:#fff;--ui-acc:#E7B5C4;--ui-card:#fff;--ui-line:#E8DDE1;--ui-txt:#292326;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:#292326}
#stage{background:#fff;padding-bottom:0;font-family:"SUIT","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body.owner #stage{padding-bottom:140px}
html.emb [data-o-onclick*="scrollTo"]{display:none!important}
body.editing #stage [data-ed]:hover{outline:1px dashed #D98AA3;outline-offset:2px;cursor:text}
body.editing #stage img{cursor:pointer}
#stage [data-sel]{outline:2px solid #2F6FEB!important;outline-offset:2px}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9000;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}#bar button:first-child{margin-left:auto}#bar button:last-child{margin-right:auto}
#bar button{flex:none;white-space:nowrap;font:700 13px/1 "Noto Sans KR",sans-serif;border:0;border-radius:999px;padding:11px 15px;background:var(--ui-bg);color:var(--ui-fg);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22)}
#bar button.on{background:#81354B}
.eo{display:none}body.editing .eo{display:inline-block!important}
body.painting #stage .kive-day *{pointer-events:none}body.painting #stage .kive-calendar-grid{touch-action:none;cursor:crosshair}
.br{display:flex;gap:6px;flex-wrap:wrap}.br button{flex:1;border:1px solid var(--ui-line);background:#fff;border-radius:10px;padding:9px 6px;font:700 12px "Noto Sans KR",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.br button.on{border-color:#81354B;box-shadow:0 0 0 2px #81354B33}.br i{width:12px;height:12px;border-radius:3px;border:1px solid #bbb;display:inline-block}
.panel{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8999;width:min(420px,calc(100% - 20px));background:var(--ui-card);color:var(--ui-txt);border:1px solid var(--ui-line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);font:500 13px/1.4 "Noto Sans KR",sans-serif;display:none}
.panel h4{margin:0 0 10px;font-size:13px;color:#81354B}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row label{width:64px;flex:none;color:#685A60}
.row input[type=text],.row input[type=number]{flex:1;min-width:0;border:1px solid var(--ui-line);border-radius:8px;padding:7px 9px;font:inherit}
.row input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--ui-line);border-radius:8px;background:#fff}
.row button{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer}
#pal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sw{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--ui-line);border-radius:10px;padding:6px 8px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:6px;border:1px solid var(--ui-line);flex:none}
.sw b{font-weight:700;font-size:12px}.sw em{margin-left:auto;font-style:normal;color:#8E777F;font-size:11px}
#modal{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#modal>div{background:#fff;color:var(--ui-txt);border-radius:16px;padding:16px;width:min(720px,100%);font:500 13px/1.4 "Noto Sans KR",sans-serif}
#modal textarea{width:100%;height:50vh;border:1px solid var(--ui-line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
#modal .b{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#modal button{border:0;border-radius:999px;padding:10px 16px;font:700 13px "Noto Sans KR",sans-serif;cursor:pointer;background:#81354B;color:#fff}
#modal button.g{background:#eee;color:#292326}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9600;background:var(--ui-bg);color:#fff;padding:10px 16px;border-radius:999px;font:700 13px "Noto Sans KR",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center}
#toast.show{opacity:1}
</style>


<style id="kive-mobile-form-fixes">
/* Date fields follow the same width as the other inquiry fields. */
#stage .kive-page .kive-form,
#stage .kive-page .kive-form > .kive-field,
#stage .kive-page #kiveDeadline,
#stage .kive-page #kivePortfolioDate {
  min-width:0 !important;
  max-width:100% !important;
  box-sizing:border-box !important;
}
#stage .kive-page #kiveDeadline,
#stage .kive-page #kivePortfolioDate {
  display:block !important;
  width:100% !important;
  inline-size:100% !important;
  min-inline-size:0 !important;
  max-inline-size:100% !important;
  margin:0 !important;
  -webkit-appearance:none;
  appearance:none;
}
@media (max-width:768px) {
  #stage .kive-page .kive-form > .kive-field {
    flex:1 1 100% !important;
    width:100% !important;
    min-width:0 !important;
    max-width:100% !important;
  }
  #stage .kive-page #kiveDeadline,
  #stage .kive-page #kivePortfolioDate {
    width:100% !important;
    min-width:0 !important;
    max-width:100% !important;
    padding-left:12px !important;
    padding-right:8px !important;
    font-size:13px !important;
  }
}
</style>
<style>.kive-footer,.kive-top-button,.kive-top-row{display:none!important}

/* 달력: 날짜 숫자와 휴무/마감 문구는 같은 왼쪽 선에 정렬 */
#stage .kive-calendar-grid .kive-day:not(.kive-empty){display:flex;flex-direction:column;align-items:flex-start;overflow:hidden}
#stage .kive-calendar-grid .kive-day .kive-day-num{margin:3px 0 0 3px}
#stage .kive-day .kive-schedule-status-label{position:static;margin:3px 0 0 3px;padding:0;text-align:left;font-size:11px;line-height:1;font-weight:800;letter-spacing:-.02em;white-space:nowrap;pointer-events:none}
@media (max-width:768px){
  #stage .kive-calendar-grid .kive-day{padding:5px!important}
}
@media (max-width:520px){
  #stage .kive-day .kive-schedule-status-label{margin:auto 0 3px 3px;font-size:9px}
}
@media (max-width:380px){
  #stage .kive-calendar-grid .kive-day{padding:4px!important}
  #stage .kive-calendar-grid .kive-day .kive-day-num{margin:1px 0 0 2px;font-size:11px!important}
  #stage .kive-day .kive-schedule-status-label{margin:auto 0 2px 2px;font-size:8px;letter-spacing:-.04em}
}
@media (max-width:340px){
  #stage .kive-day .kive-schedule-status-label{margin:auto 0 1px 2px}
}
/* 모바일: 로고와 아래 문구 크기 줄임 */
@media (max-width:600px){
  #stage .kive-logo-match{width:125px!important}
  #stage .kive-logo-title{font-size:10px!important}
}
/* iframe 안에서 높이 자동 맞춤 후에는 스크롤바 숨김 */
html.kive-auto,html.kive-auto body{overflow:hidden!important}
#stage .kive-inner>section:last-of-type{margin-bottom:0!important}
#stage{padding-bottom:8px}
@media (max-width:600px){#stage{padding-bottom:6px}}
body.owner #stage{padding-bottom:140px}
</style>
</head>
<body>
<div id="stage"></div>

<template id="orig">
<div class="kive-page" id="kive-top" style='width:100%; box-sizing:border-box; padding:0 4%; font-family:"SUIT","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#292326; font-size:14px; letter-spacing:-0.02em; line-height:1.65; word-break:keep-all;'>
<div class="kive-inner" style="max-width:1000px; margin:0 auto;">
<!-- LOGO -->
<div class="kive-logo" style="text-align:center; padding:25px 0 55px;">
  <div class="kive-logo-match" style="display:inline-flex; flex-direction:column; align-items:stretch; width:180px; max-width:90%;">
    <img alt="KIVE" src="./kive-logo.png" style="display:block; width:100%; max-width:100%; height:auto; aspect-ratio:1500 / 800; object-fit:contain; margin:0 0 15px;"/>
    <div class="kive-logo-title" style="color:#81354B; font-size:13px; font-weight:700; letter-spacing:-0.045em; white-space:nowrap; text-align:center;">
      GRAPHIC DESIGNER KIVE
    </div>
  </div>
</div>
<!-- 01 · SCHEDULE -->
<section class="kive-section" style="margin-bottom:65px;">
<div class="kive-section-label" style="margin-bottom:3px; color:#A9959C; font-size:10px; font-weight:800; letter-spacing:0.08em;">01 · SCHEDULE</div>
<h2 class="kive-section-title" style="margin:0 0 22px; color:#81354B; font-size:22px; font-weight:800; letter-spacing:-0.045em;">작업 일정</h2>
<div class="kive-calendar-box" style="border:1px solid #E8DDE1; border-radius:18px; background:#FAF7F8; padding:14px; position:relative; box-sizing:border-box;">
<div id="kive-calendar-scroll" style="display:block; width:100%; overflow:hidden; position:relative;"></div>
<div class="kive-calendar-guide" style="display:flex; justify-content:flex-end; flex-wrap:wrap; gap:15px; margin-top:15px; color:#796A70; font-size:11px;">
<div class="kive-guide-item" style="display:flex; align-items:center; gap:6px;">
<span class="kive-guide-white" style="width:10px; height:10px; box-sizing:border-box; border:1px solid #E8DDE1; border-radius:3px; background:#fff;"></span>
                작업 가능
            </div>
<div class="kive-guide-item" style="display:flex; align-items:center; gap:6px;">
<span class="kive-guide-off" style="width:10px; height:10px; box-sizing:border-box; border:1px solid #E1D6D9; border-radius:3px; background:#F3EEF0;"></span>
                휴무
            </div>
<div class="kive-guide-item" style="display:flex; align-items:center; gap:6px;">
<span class="kive-guide-closed" style="width:10px; height:10px; box-sizing:border-box; border:1px solid #D9BFC8; border-radius:3px; background:#F8EDEF;"></span>
                마감
            </div>
</div>
</div>
</section>
<!-- 02 · PROCESS -->
<section class="kive-section kive-process-section" style="margin-bottom:40px;">
<div class="kive-section-label" style="margin-bottom:3px; color:#A9959C; font-size:10px; font-weight:800; letter-spacing:0.08em;">02 · PROCESS</div>
<h2 class="kive-section-title" style="margin:0 0 22px; color:#81354B; font-size:22px; font-weight:800; letter-spacing:-0.045em;">작업 과정</h2>
<div class="kive-process" style="display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch; gap:6px; width:100%;">
<div class="kive-process-card" style="flex:1 1 104px; min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; padding:12px 6px; border:1px solid #E8DDE1; border-radius:16px; background:#fff; text-align:center;">
<div class="kive-process-number" style="margin-bottom:5px; color:#81354B; font-size:14px; font-weight:800; letter-spacing:-0.06em;">01</div>
<div class="kive-process-name" style="color:#292326; font-size:12px; font-weight:800; line-height:1.45;">신청 양식 작성 및<br/>아트머그 문의</div>
</div>
<div class="kive-process-arrow" style="flex:0 0 18px; align-self:center; color:#B59DA5; font-size:13px; text-align:center;">→</div>
<div class="kive-process-card" style="flex:1 1 104px; min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; padding:12px 6px; border:1px solid #E8DDE1; border-radius:16px; background:#fff; text-align:center;">
<div class="kive-process-number" style="margin-bottom:5px; color:#81354B; font-size:14px; font-weight:800; letter-spacing:-0.06em;">02</div>
<div class="kive-process-name" style="color:#292326; font-size:12px; font-weight:800; line-height:1.45;">결제</div>
</div>
<div class="kive-process-arrow" style="flex:0 0 18px; align-self:center; color:#B59DA5; font-size:13px; text-align:center;">→</div>
<div class="kive-process-card" style="flex:1 1 104px; min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; padding:12px 6px; border:1px solid #E8DDE1; border-radius:16px; background:#fff; text-align:center;">
<div class="kive-process-number" style="margin-bottom:5px; color:#81354B; font-size:14px; font-weight:800; letter-spacing:-0.06em;">03</div>
<div class="kive-process-name" style="color:#292326; font-size:12px; font-weight:800; line-height:1.45;">작업 시작</div>
</div>
<div class="kive-process-arrow" style="flex:0 0 18px; align-self:center; color:#B59DA5; font-size:13px; text-align:center;">→</div>
<div class="kive-process-card" style="flex:1 1 104px; min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; padding:12px 6px; border:1px solid #E8DDE1; border-radius:16px; background:#fff; text-align:center;">
<div class="kive-process-number" style="margin-bottom:5px; color:#81354B; font-size:14px; font-weight:800; letter-spacing:-0.06em;">04</div>
<div class="kive-process-name" style="color:#292326; font-size:12px; font-weight:800; line-height:1.45;">컨펌 및 수정</div>
</div>
<div class="kive-process-arrow" style="flex:0 0 18px; align-self:center; color:#B59DA5; font-size:13px; text-align:center;">→</div>
<div class="kive-process-card final" style="flex:1 1 104px; min-width:0; min-height:86px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; padding:12px 6px; border:1px solid #E8DDE1; border-radius:16px; background:#fff; text-align:center; border-color:#81354B;">
<div class="kive-process-number" style="margin-bottom:5px; color:#81354B; font-size:14px; font-weight:800; letter-spacing:-0.06em;">05</div>
<div class="kive-process-name" style="color:#81354B; font-size:12px; font-weight:800; line-height:1.45;">최종 작업물 전달</div>
</div>
</div>
</section>
<!-- 03 · NOTICE -->
<section class="kive-section" style="margin-bottom:65px;">
<div class="kive-section-label" style="margin-bottom:3px; color:#A9959C; font-size:10px; font-weight:800; letter-spacing:0.08em;">03 · NOTICE</div>
<h2 class="kive-section-title" style="margin:0 0 22px; color:#81354B; font-size:22px; font-weight:800; letter-spacing:-0.045em;">공지사항</h2>
<div class="kive-notice-intro" style="margin-bottom:12px; color:#4B3E43; font-size:13px; font-weight:700;">
        문의 전 공지사항을 반드시 확인해 주세요.
    </div>
<div class="kive-notice" style="border-top:1px solid #E8DDE1; border-bottom:1px solid #E8DDE1;">
<details style="position:relative; border-bottom:1px solid #E8DDE1;">
<summary style="display:block; position:relative; padding:17px 35px 17px 16px; cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:#81354B;">작업 및 저작권 관련 안내<span class="kive-summary-arrow" style="position:absolute; right:18px; top:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #81354B; display:block;"></span></summary>
<div class="kive-notice-content" style="padding:0 16px 18px; color:#62565A; font-size:12px; line-height:1.85;"><span class="kive-arrow-open" style="position:absolute; right:14px; top:18px; width:20px; height:20px; background:#fff; pointer-events:none; display:block;"><span style="position:absolute; left:4px; top:6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:7px solid #81354B; display:block;"></span></span>
<p style="margin:0 0 8px;">모든 작업물의 저작권은 디자이너 키브(kive)에게 있습니다.</p>
<p style="margin:0 0 8px;">2차 가공 및 재배포, AI 관련 학습, 디자인 카피에 해당하는 모든 부분은 금지합니다.</p>
</div>
</details>
<details style="position:relative; border-bottom:1px solid #E8DDE1;">
<summary style="display:block; position:relative; padding:17px 35px 17px 16px; cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:#81354B;">작업 일정<span class="kive-summary-arrow" style="position:absolute; right:18px; top:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #81354B; display:block;"></span></summary>
<div class="kive-notice-content" style="padding:0 16px 18px; color:#62565A; font-size:12px; line-height:1.85;"><span class="kive-arrow-open" style="position:absolute; right:14px; top:18px; width:20px; height:20px; background:#fff; pointer-events:none; display:block;"><span style="position:absolute; left:4px; top:6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:7px solid #81354B; display:block;"></span></span>
<p style="margin:0 0 8px;">작업 시작은 주문서 작성 및 입금 완료 확인 시 시작되며, 일정 카운트 시점 또한 동일합니다.</p>
<p style="margin:0 0 8px;">작업물은 2주 내외로 작업이 완료되며, 수정 단계 후 최종 작업물이 전달됩니다.</p>
</div>
</details>
<details style="position:relative; border-bottom:1px solid #E8DDE1;">
<summary style="display:block; position:relative; padding:17px 35px 17px 16px; cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:#81354B;">신청 시 유의사항<span class="kive-summary-arrow" style="position:absolute; right:18px; top:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #81354B; display:block;"></span></summary>
<div class="kive-notice-content" style="padding:0 16px 18px; color:#62565A; font-size:12px; line-height:1.85;"><span class="kive-arrow-open" style="position:absolute; right:14px; top:18px; width:20px; height:20px; background:#fff; pointer-events:none; display:block;"><span style="position:absolute; left:4px; top:6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:7px solid #81354B; display:block;"></span></span>
<p style="margin:0 0 8px;">원하는 분위기 및 레퍼런스, 관련 이미지 전달 등은 반드시 작업 시작 전 전달해 주셔야 합니다.<br/>* 버츄얼 모델 이미지, 일러스트 그림 등 포함.</p>
<p style="margin:0 0 8px;">작업 도중 전반적인 수정이 필요한 요청 시 추가 비용 발생.</p>
</div>
</details>
<details style="position:relative; border-bottom:1px solid #E8DDE1;">
<summary style="display:block; position:relative; padding:17px 35px 17px 16px; cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:#81354B;">작업물 관련 공지<span class="kive-summary-arrow" style="position:absolute; right:18px; top:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #81354B; display:block;"></span></summary>
<div class="kive-notice-content" style="padding:0 16px 18px; color:#62565A; font-size:12px; line-height:1.85;"><span class="kive-arrow-open" style="position:absolute; right:14px; top:18px; width:20px; height:20px; background:#fff; pointer-events:none; display:block;"><span style="position:absolute; left:4px; top:6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:7px solid #81354B; display:block;"></span></span>
<p style="margin:0 0 8px;">모든 작업물의 경우 작가의 포트폴리오로 사용될 수 있으며, 비공개의 경우 추가 비용이 발생합니다.<br/>*포트폴리오 공개 일정 조율 가능</p>
<p style="margin:0 0 8px;">기본적으로 방송용 및 비상업적 용도 기준이며, 상업용은 기존 단가의 두 배 / 외주는 기존 단가의 세 배로 진행합니다.</p>

<script>
(function(){

}

/* ---------- 견적 계산기 ---------- */

/* ---------- 문의 양식 복사 ---------- */

/* ---------- 클릭 처리 (원래 onclick 문자열에서 대상 id 를 읽어 동작) ---------- */
stage.addEventListener('click',function(e){

/* ---------- 일정 칠하기 ---------- */
function paint(d,k){

/* ---------- 포트폴리오 사진 업로드 (규격 자동 맞춤) ---------- */
var SZ={'kive-poster':[1500,2100],'kive-schedule':[1920,1080],'kive-ppt':[1920,1080],'kive-replay':[1920,1080],'kive-banner':[1920,540]};

    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL('image/jpeg',.9))};im.src=fr.result};
  fr.readAsDataURL(file)})}
function activePanel(){return qa('.kive-portfolio-panel').filter(function(p){return p.style.display!=='none'})[0]}

var dl=0;

/* ---------- 편집 모드 ---------- */

<script id="kive-site-data-loader">
(function(){
  var root=document.getElementById('stage');
  if(!root)return;
  var defaultCategories=[{id:'poster',label:'포스터',panel:'kive-poster'},{id:'schedule',label:'스케줄표',panel:'kive-schedule'},{id:'ppt',label:'PPT',panel:'kive-ppt'},{id:'replay',label:'다시보기 썸네일',panel:'kive-replay'},{id:'banner',label:'치지직 배너',panel:'kive-banner'}];
  var categoryMap={};
  var imageStyle='display:block;width:100%;max-width:100%;margin:0;padding:0;border-radius:15px;background:#F1EAED;height:auto;object-fit:contain;';
  function sizeLogo(){
    var match=root.querySelector('.kive-logo-match'), title=root.querySelector('.kive-logo-title');
    if(!match||!title)return;
    title.style.whiteSpace='nowrap';
    var width=Math.ceil(title.getBoundingClientRect().width);
    if(width>0){match.style.width=width+'px';match.style.maxWidth='90%';}
  }
  function render(data){
    var categories=(data.portfolioCategories&&data.portfolioCategories.length?data.portfolioCategories:defaultCategories);
    // Rebuild category tabs from saved data instead of reusing static tabs; this prevents duplicates.
    var tabs=root.querySelector('.kive-portfolio-tabs');
    var existingPanels={};root.querySelectorAll('.kive-portfolio-panel').forEach(function(el){existingPanels[el.id]=el;});
    var panelHost=root.querySelector('.kive-portfolio-panel');panelHost=panelHost?panelHost.parentNode:root;
    if(tabs)tabs.innerHTML='';
    var panels={};categoryMap={};
    categories.forEach(function(c){
      var id=String(c.id||'');if(!id)return;
      var panelId=c.panel||('kive-cat-'+id);categoryMap[id]=panelId;
      var panel=existingPanels[panelId];
      if(!panel){panel=document.createElement('div');panel.className='kive-portfolio-panel kive-wide';panel.id=panelId;panel.style.cssText='display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;width:100%;box-sizing:border-box;align-items:start;';panelHost.appendChild(panel);}
      panel.innerHTML='';panel.style.display='none';panels[id]=panel;
      if(tabs){
        var tab=document.createElement('button');tab.type='button';tab.className='kive-portfolio-tab';
        tab.style.cssText='padding:9px 16px;border:1px solid #E8DDE1;border-radius:999px;background:#fff;color:#685A60;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;';
        tab.textContent=c.label||id;tab.setAttribute('data-category-id',id);
        tab.onclick=function(){tabs.querySelectorAll('.kive-portfolio-tab').forEach(function(t){t.style.borderColor='#E8DDE1';t.style.background='#fff';t.style.color='#685A60';});root.querySelectorAll('.kive-portfolio-panel').forEach(function(p){p.style.display='none';});tab.style.borderColor='#81354B';tab.style.background='#81354B';tab.style.color='#fff';panel.style.display='grid';};
        tabs.appendChild(tab);
      }
    });
    // Hide unused legacy panels so only configured categories are displayed.
    Object.keys(existingPanels).forEach(function(id){if(!Object.keys(panels).some(function(catId){return panels[catId]===existingPanels[id];})){existingPanels[id].style.display='none';existingPanels[id].innerHTML='';}});
    var active=categories[0];if(active&&panels[active.id]){panels[active.id].style.display='grid';if(tabs){tabs.querySelectorAll('.kive-portfolio-tab').forEach(function(t){var on=t.getAttribute('data-category-id')===active.id;t.style.background=on?'#81354B':'#fff';t.style.color=on?'#fff':'#685A60';t.style.borderColor=on?'#81354B':'#E8DDE1';});}}

    var defMode=data.portfolioSortMode||'latest',modes=data.portfolioSortModes||{};
    var byCat={};(data.portfolio||[]).forEach(function(item,index){var k=item.category;(byCat[k]=byCat[k]||[]).push({item:item,index:index});});
    function latestCmp(a,b){
      var ad=a.item.createdAt||a.item.uploadedAt||a.item.date||'';
      var bd=b.item.createdAt||b.item.uploadedAt||b.item.date||'';
      if(ad&&bd&&ad!==bd)return String(bd).localeCompare(String(ad));
      if(ad&&!bd)return -1;
      if(bd&&!ad)return 1;
      return b.index-a.index;
    }
    Object.keys(byCat).forEach(function(k){
      if((modes[k]||defMode)==='latest')byCat[k].sort(latestCmp);
      var panel=panels[k];if(!panel)return;
      byCat[k].forEach(function(entry){var item=entry.item;
        if(!item.path)return;
        var img=document.createElement('img');img.className='kive-portfolio-img';img.alt=item.title||'';img.loading=(active&&panels[active.id]===panel)?'eager':'lazy';img.decoding='async';img.src=item.path;img.style.cssText=imageStyle;
        img.addEventListener('error',function(){img.remove();});
        panel.appendChild(img);
      });
    });
    sizeLogo();
  }
  function load(){
    sizeLogo();
    fetch('./site-data.json?updated='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('site-data.json unavailable');return r.json();})
      .then(render)
      .catch(function(){/* Keep empty galleries when no portfolio data exists yet. */});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
  window.addEventListener('resize',sizeLogo);
})();
</script>






<script id="kive-calendar">
(function(){
  var wrap=document.getElementById('kive-calendar-scroll');
  if(!wrap)return;
  var DATA_URL='./site-data.json';
  var STATUS={
    off:{label:'휴무',bg:'#F3EEF0',border:'#E1D6D9',color:'#7A6A71'},
    closed:{label:'마감',bg:'#F8EDEF',border:'#D9BFC8',color:'#81354B'}
  };
  var schedule={};
  function pad(n){return (n<10?'0':'')+n}
  function seoulToday(){
    var p={};
    new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'})
      .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    return {y:+p.year,m:+p.month-1};
  }
  var t0=seoulToday(), view=new Date(t0.y,t0.m,1);

  function statusOf(key){
    var it=schedule[key];
    var s=it&&typeof it==='object'?it.status:it;
    return STATUS[s]?s:'';
  }
  function navButton(dir){
    var b=document.createElement('button');
    b.type='button';
    b.setAttribute('aria-label',dir<0?'이전 달':'다음 달');
    b.style.cssText='display:flex;align-items:center;justify-content:center;width:22px;min-width:22px;max-width:22px;height:22px;min-height:22px;max-height:22px;flex:0 0 22px;padding:0;margin:0;box-sizing:border-box;border:1px solid #E8DDE1;border-radius:50%;background:#fff;color:#81354B;line-height:1;cursor:pointer;appearance:none;-webkit-appearance:none;';
    b.innerHTML='<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="display:block;pointer-events:none;" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+(dir<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7')+'"/></svg>';
    b.addEventListener('click',function(e){
      e.preventDefault();
      view=new Date(view.getFullYear(),view.getMonth()+dir,1);
      render();
    });
    return b;
  }
  function render(){
    var y=view.getFullYear(), m=view.getMonth();
    var slide=document.createElement('div');
    slide.className='kive-calendar-slide';
    slide.id='kive-cal-'+y+'-'+pad(m+1);
    slide.style.cssText='display:block;position:relative;width:100%;min-width:0;box-sizing:border-box;';

    var top=document.createElement('div');
    top.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 12px;';
    var title=document.createElement('div');
    title.style.cssText='padding:0 2px;color:#81354B;font-size:15px;font-weight:800;text-align:left;line-height:22px;';
    title.textContent=y+'년 '+(m+1)+'월';
    var nav=document.createElement('div');
    nav.style.cssText='display:flex;align-items:center;gap:4px;';
    nav.appendChild(navButton(-1));nav.appendChild(navButton(1));
    top.appendChild(title);top.appendChild(nav);
    slide.appendChild(top);

    var head=document.createElement('div');
    head.className='kive-calendar-head';
    head.style.cssText='display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;';
    ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(function(d){
      var x=document.createElement('div');x.className='kive-week';
      x.style.cssText='text-align:center;padding:3px 0 6px;color:#8E777F;font-size:10px;font-weight:800;letter-spacing:.03em;';
      x.textContent=d;head.appendChild(x);
    });
    slide.appendChild(head);

    var grid=document.createElement('div');
    grid.className='kive-calendar-grid';
    grid.style.cssText='display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;';
    var offset=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    for(var i=0;i<offset;i++){
      var blank=document.createElement('div');
      blank.className='kive-day kive-empty';
      blank.style.cssText='min-width:0;width:100%;aspect-ratio:1 / 1;max-height:76px;box-sizing:border-box;border:1px solid transparent;border-radius:12px;';
      grid.appendChild(blank);
    }
    for(var d=1;d<=days;d++){
      var key=y+'-'+pad(m+1)+'-'+pad(d), st=statusOf(key), cfg=STATUS[st];
      var cell=document.createElement('div');
      cell.className='kive-day';cell.setAttribute('data-date',key);
      cell.style.cssText='text-align:left;min-width:0;width:100%;aspect-ratio:1 / 1;max-height:76px;min-height:0;box-sizing:border-box;position:relative;padding:6px;border-radius:12px;border:1px solid '+(cfg?cfg.border:'#E8DDE1')+';background:'+(cfg?cfg.bg:'#fff')+';';
      var num=document.createElement('div');
      num.className='kive-day-num';
      num.style.cssText='text-align:left;color:#41373A;font-size:12px;font-weight:800;line-height:1.15;';
      num.textContent=d;cell.appendChild(num);
      if(cfg){
        cell.setAttribute('data-kive-status',st);
        var tag=document.createElement('div');
        tag.className='kive-schedule-status-label';
        tag.style.color=cfg.color;
        tag.textContent=cfg.label;
        cell.appendChild(tag);
      }
      grid.appendChild(cell);
    }
    slide.appendChild(grid);
    wrap.innerHTML='';
    wrap.appendChild(slide);
  }

  function load(){
    fetch(DATA_URL+'?schedule='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('site-data.json unavailable');return r.json();})
      .then(function(data){
        schedule=data&&data.schedule&&typeof data.schedule==='object'?data.schedule:{};
        render();
      })
      .catch(function(){});
  }
  render();
  load();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){window.dispatchEvent(new Event('resize'));});
})();

/* iframe 높이 자동 맞춤: 부모(아트머그) 쪽 스크립트가 있으면 높이를 알려 준다 */
(function(){
  if(window.parent===window)return;
  var stage=document.getElementById('stage');
  if(!stage)return;
  var last=-1;
  function send(force){
    var h=Math.ceil(stage.getBoundingClientRect().height);
    if(!force&&h===last)return;
    last=h;
    try{window.parent.postMessage({type:'kive-height',height:h},'*');}catch(e){}
  }
  window.addEventListener('message',function(e){
    if(e.source!==window.parent||!e.data)return;
    if(e.data.type==='kive-ack'){document.documentElement.classList.add('kive-auto');send(true);}
  });
  if(window.ResizeObserver)new ResizeObserver(function(){send(false);}).observe(stage);
  window.addEventListener('load',function(){send(true);});
  window.addEventListener('resize',function(){send(false);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){send(false);});
  setInterval(function(){send(false);},1000);
  send(true);
})();

</script>
<script id="kive-content-loader">
/* 관리자 페이지에서 저장한 공지사항 / 견적 옵션 / 문의 양식 문구를 site-data.json 에서 읽어 화면에 반영 */
(function(){
  var root=document.getElementById('stage');
  if(!root)return;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function txt(s){return esc(s).replace(/\r?\n/g,'<br/>')}
  function pick(o,keys){if(!o||typeof o!=='object')return '';for(var i=0;i<keys.length;i++){var v=o[keys[i]];if(v!=null&&v!=='')return v}return ''}
  function won(n){return Number(n||0).toLocaleString('ko-KR')+'원'}

  function applyNotices(data){
    var intro=root.querySelector('.kive-notice-intro');
    if(intro&&typeof data.noticesIntro==='string'&&data.noticesIntro.trim())intro.textContent=data.noticesIntro.trim();
    var list=(Array.isArray(data.notices)?data.notices:[]).filter(function(n){return n&&String(pick(n,['title','label','name'])).trim()});
    var box=root.querySelector('.kive-notice');
    if(!box||!list.length)return;
    var arrow='<span class="kive-summary-arrow" style="position:absolute; right:18px; top:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid #81354B; display:block;"></span>';
    var open='<span class="kive-arrow-open" style="position:absolute; right:14px; top:18px; width:20px; height:20px; background:#fff; pointer-events:none; display:block;"><span style="position:absolute; left:4px; top:6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:7px solid #81354B; display:block;"></span></span>';
    box.innerHTML=list.map(function(n){
      var lines=Array.isArray(n.lines)?n.lines:(typeof n.body==='string'?n.body.split(/\n\s*\n/):[]);
      return '<details style="position:relative; border-bottom:1px solid #E8DDE1;"><summary style="display:block; position:relative; padding:17px 35px 17px 16px; cursor:pointer; list-style:none; font-size:13px; font-weight:800; color:#81354B;">'+esc(pick(n,['title','label','name']))+arrow+'</summary><div class="kive-notice-content" style="padding:0 16px 18px; color:#62565A; font-size:12px; line-height:1.85;">'+open+lines.filter(function(l){return String(l).trim()}).map(function(l){return '<p style="margin:0 0 8px;">'+txt(l)+'</p>'}).join('')+'</div></details>';
    }).join('');
  }

  function rowHtml(it,kind){
    var label=pick(it,['label','name','title']),price=Number(pick(it,['price','amount'])||0),note=String(pick(it,['note','description','desc'])||'').trim(),has=!!note;
    var inp=kind==='base'
      ?'<input name="kive-base" type="checkbox" value="'+price+'" style="accent-color:#81354B;"/>'
      :'<input class="kive-extra" type="checkbox" value="'+price+'" style="accent-color:#81354B;"/>';
    return '<label class="kive-price-row'+(has?' has-note':'')+'" style="display:flex; align-items:center; justify-content:space-between; gap:15px; padding:11px 0; '+(has?'border-bottom:0; padding-bottom:5px;':'border-bottom:1px solid #F0EAEC;')+'"><span class="kive-price-label" style="display:flex; align-items:center; gap:9px; color:#40363A; font-size:12px;">'+inp+esc(label)+'</span><span class="kive-price-number" style="flex-shrink:0; color:#81354B; font-size:12px; font-weight:800;">'+(kind==='extra'?'+':'')+won(price)+'</span></label>'
      +(has?'<div class="kive-price-note" style="margin:-5px 0 0 0; padding:0 0 11px 30px; border-bottom:1px solid #F0EAEC; color:#9B8C92; text-align:left; width:100%; box-sizing:border-box; font-size:10px; line-height:1.5;">'+txt(note)+'</div>':'');
  }
  function applyPrices(data){
    var pr=data.prices;
    if(!pr||typeof pr!=='object')return;
    var groups=root.querySelectorAll('.kive-price-options .kive-price-group');
    [['base',0],['extra',1]].forEach(function(k){
      var g=groups[k[1]],items=(Array.isArray(pr[k[0]])?pr[k[0]]:[]).filter(function(it){return it&&String(pick(it,['label','name','title'])).trim()});
      if(!g||!items.length)return;
      var title=g.querySelector('.kive-price-group-title');
      g.innerHTML=(title?title.outerHTML:'')+items.map(function(it){return rowHtml(it,k[0])}).join('');
    });
    var ps=Array.isArray(pr.purposes)?pr.purposes:[];
    var pin=root.querySelectorAll('input[name=kive-purpose]'),fin=root.querySelectorAll('input[name=form-purpose]');
    ps.forEach(function(p,i){
      var lab=String(pick(p,['label','name','title'])).trim();
      if(!lab||i>=pin.length)return;
      var m=Number(pick(p,['multiplier','mult','value'])||1);if(!(m>0))m=1;
      var sp=pin[i].parentElement.querySelector('span');
      pin[i].value=String(m);pin[i].setAttribute('data-text',lab+' ×'+m);if(sp)sp.textContent=lab+' ×'+m;
      if(fin[i]){fin[i].value=lab;var fs=fin[i].parentElement.querySelector('span');if(fs)fs.textContent=lab}
    });
    var cur=root.querySelector('input[name=kive-purpose]:checked'),pt=document.getElementById('kivePurposeText');
    if(cur&&pt)pt.textContent=cur.getAttribute('data-text');
  }

  var FORM_KEYS=['nickname','channel','type','purpose','deadline','portfolioDate','color','mood','text','reference','extraRequest'];
  function applyForm(data){
    var fl=data.formLabels;
    if(!fl||typeof fl!=='object')return;
    var fields=root.querySelectorAll('.kive-form > .kive-field');
    FORM_KEYS.forEach(function(key,i){
      var f=fields[i],e=fl[key];
      if(!f||e==null)return;
      var label=typeof e==='string'?e:pick(e,['label','title','name']);
      var ph=typeof e==='object'?pick(e,['placeholder','hint']):'';
      var lb=f.querySelector('.kive-label');
      if(lb&&String(label).trim())lb.textContent=String(label).trim();
      if(!String(ph).trim())return;
      ph=String(ph).trim();
      var el=f.querySelector('[data-placeholder]');
      if(el){
        var old=(el.getAttribute('data-placeholder')||'').trim();
        if(el.innerText.trim()===old)el.innerText=ph;
        el.setAttribute('data-placeholder',ph);
      }else if(key==='reference'){
        var box=f.querySelector('.kive-input');if(box)box.textContent=ph;
      }
    });
  }

  function load(){
    fetch('./site-data.json?content='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('site-data.json unavailable');return r.json()})
      .then(function(data){
        try{applyNotices(data)}catch(e){}
        try{applyPrices(data)}catch(e){}
        try{applyForm(data)}catch(e){}
      })
      .catch(function(){/* 데이터가 없으면 기본 문구 그대로 */});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
})();
</script>

</body>
</html>
